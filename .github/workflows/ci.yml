name: CI

# CI Pracuj.be — GitHub-hosted runnery (`ubuntu-latest`). Decyzja właściciela z 2026-09-23:
# współdzielony self-hosted runner serializował wszystkie przebiegi (kolejka FIFO, #50);
# 2026-09-27: repo jest publiczne, więc minuty hostowanych runnerów są darmowe — CI
# optymalizujemy pod czas przebiegu (równoległe joby E2E), nie pod liczbę minut.
#
# Zasady:
# - nowy push do PR anuluje trwający przebieg tego PR (main nigdy — Railway
#   `Wait for CI` potrzebuje wyniku każdego SHA na main);
# - joby E2E startują po zielonym buildzie (build po lint/typecheck/unit);
# - każdy job ma `timeout-minutes`, więc zawieszony krok nie blokuje przebiegu;
# - joby E2E odtwarzają `.next` z jobu build (cache Actions) zamiast budować drugi raz (#127);
# - E2E: 3 shardy + pomiar + fixture'y (full w 2 częściach) równolegle, wynik zbiera wymagany check
#   „E2E (Playwright)”; przepływ na PostgreSQL 16 (`e2e-real`) na razie informacyjny.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Minimalne uprawnienia tokenu GITHUB_TOKEN (least privilege).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Placeholdery pozwalające na build bez prawdziwych sekretów (strony publiczne mają fallback).
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  NEXT_PUBLIC_DEFAULT_LOCALE: pl
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  install:
    name: Install & cache deps
    # PR z forków nie dostają CI z tego repozytorium (bezpieczeństwo sekretów).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # node_modules współdzielimy między jobami przez cache Actions, NIE artefakt:
      # cache nie liczy się do płatnego limitu storage (osobny limit 10 GB/repo),
      # a artefakty node_modules zjadały cały miesięczny limit storage organizacji.
      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --fund=false

  lint:
    name: Lint
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
      - name: Install dependencies (cache miss)
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --fund=false
      - run: node scripts/check-ci-workflows.mjs
      - run: npm run lint

  typecheck:
    name: Typecheck
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
      - name: Install dependencies (cache miss)
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --fund=false
      - run: npm run typecheck

  unit:
    name: Unit tests (Vitest)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # Nie ufamy kompletności odtworzonego node_modules w tym jobie. npm ci
      # odtwarza drzewo z lockfile; cache npm przyspiesza pobranie paczek.
      - name: Install dependencies from lockfile
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # Testy eksportu grafik (baner, Story) renderują przez Chromium Playwrighta.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify ms dependency before tests
        run: node -e "console.log('ms resolved at:', require.resolve('ms'))"
      - name: Run unit tests
        id: vitest
        run: npm run test
      - name: Diagnose dependency state after failure
        if: failure()
        run: |
          pwd
          if test -f node_modules/ms/index.js; then
            echo 'node_modules/ms/index.js exists after failure'
          else
            echo 'node_modules/ms/index.js is missing after failure'
          fi
          npm ls ms --depth=0 || true

  sca:
    name: SCA (npm audit)
    # Software Composition Analysis — twarda bramka na PRAWDZIWE podatności high/critical (audyt CI-08).
    # Audyt z package-lock.json (`--package-lock-only`) — deterministyczne drzewo, nie wymaga
    # node_modules. Skrypt blokuje tylko przy
    # realnych podatnościach; niestabilny/wygaszany endpoint audytu npm nie wywala całego CI.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: bash scripts/sca-audit.sh

  build:
    name: Build (Next.js)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: [lint, typecheck, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
      - name: Install dependencies (cache miss)
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --fund=false
      # Ten sam build służy jobowi e2e (#127) — dlatego z testowym tokenem Cloudflare Web
      # Analytics (tests/e2e/fixtures/trackers.ts), inaczej playwright.config.ts przebuduje go (#234).
      # Artefakt nie trafia na produkcję: Railway buduje sam ze źródeł i własnych zmiennych.
      - name: Build application
        env:
          NEXT_PUBLIC_CF_WEB_ANALYTICS_TOKEN: e2e-cf-analytics-token-00000000
        run: npm run build
      - name: Verify build output
        run: node scripts/check-next-build.mjs
      # Bramka wydajności, część statyczna (#395, ~1 s): JS gzip tras i fonty z tego builda
      # vs perf-budgets.json. Tabela w podsumowaniu przebiegu.
      - name: Performance budget (static)
        run: node scripts/perf-budget-static.mjs
      # Cache Actions, NIE artefakt: nie zjada płatnego storage organizacji.
      # Bez .next/cache (cache kompilatora nie jest potrzebny do `next start`).
      - name: Save build for E2E
        uses: actions/cache/save@v6
        with:
          path: |
            .next
            !.next/cache
          key: next-build-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

  rls:
    name: RLS integration (PostgreSQL 16)
    # Weryfikuje polityki RLS i triggery integralności
    # na CZYSTYM PostgreSQL 16 (produkcyjny bootstrap ról + wszystkie migracje + strażnik roli
    # z kontrolami ujemnymi + adwersaryjne asercje).
    # Domyka lukę audytu „migracje/RLS niezweryfikowane w CI". Nie wymaga node_modules.
    #
    # Klient psql i testy działają w izolowanym kontenerze usługi.
    # Nie wymagamy instalacji klienta na hoście ani wspólnego portu 5432.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Prepare isolated database tests
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" mkdir -p /tmp/pracujbe-tests
          docker cp scripts "$POSTGRES_CONTAINER:/tmp/pracujbe-tests/scripts"
          docker cp supabase "$POSTGRES_CONTAINER:/tmp/pracujbe-tests/supabase"
          docker cp database "$POSTGRES_CONTAINER:/tmp/pracujbe-tests/database"
          docker exec "$POSTGRES_CONTAINER" psql --version
      - name: RLS/triggers adversarial tests
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: >-
          docker exec -e PGHOST=127.0.0.1 -e PGPORT=5432 -e PGUSER=postgres -e PGPASSWORD=postgres
          "$POSTGRES_CONTAINER" bash /tmp/pracujbe-tests/scripts/test-rls.sh
      - name: Backup restore verification (pg_dump -> izolowana baza)
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: >-
          docker exec -e PGHOST=127.0.0.1 -e PGPORT=5432 -e PGUSER=postgres -e PGPASSWORD=postgres
          "$POSTGRES_CONTAINER" bash /tmp/pracujbe-tests/scripts/db/test-restore.sh
      - name: Seed data load test (10 firm / 50 ofert / 40 kandydatów)
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: >-
          docker exec -e PGHOST=127.0.0.1 -e PGPORT=5432 -e PGUSER=postgres -e PGPASSWORD=postgres
          "$POSTGRES_CONTAINER" bash /tmp/pracujbe-tests/scripts/test-seed.sh

  migrations:
    name: Migration runner (PostgreSQL 16)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      auth:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: pracujbe_auth_schema_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      bootstrap:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: pracujbe_bootstrap_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: pracujbe_migration_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/cache/restore@v6
        id: node-modules
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Verify migrations on isolated database
        env:
          MIGRATION_TEST_DATABASE_URL: postgresql://postgres:isolated-test-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/pracujbe_migration_test
        run: node scripts/db/test-migrations.mjs
      - name: Verify production bootstrap and domain migrations
        env:
          BOOTSTRAP_TEST_DATABASE_URL: postgresql://postgres:isolated-test-only@127.0.0.1:${{ job.services.bootstrap.ports[5432] }}/pracujbe_bootstrap_test
          BOOTSTRAP_TEST_ISOLATED_CLUSTER: 'yes'
        run: node scripts/db/test-bootstrap.mjs
      - name: Verify auth schema and credential isolation
        env:
          AUTH_SCHEMA_TEST_DATABASE_URL: postgresql://postgres:isolated-test-only@127.0.0.1:${{ job.services.auth.ports[5432] }}/pracujbe_auth_schema_test
          AUTH_SCHEMA_TEST_ISOLATED_CLUSTER: 'yes'
        run: node scripts/db/test-auth-schema.mjs
      - name: Verify runtime PostgreSQL isolation
        run: node node_modules/vitest/vitest.mjs run --config vitest.integration.config.ts

  e2e-shard:
    name: E2E shard ${{ matrix.shard }}/3
    # Zestaw demo (`playwright.config.ts`, projekt `chromium`) podzielony na 3 równoległe
    # shardy PO CZASIE testów, nie po ich liczbie: `--shard` Playwrighta dzielił pliki
    # alfabetycznie, a najdłuższe przeglądy axe leżą blisko siebie w alfabecie — 7,4 / 2,5 /
    # 5,1 min (przebieg 36327645914). `E2E_DEMO_SHARD=1|2|3` wybiera w konfiguracji jedną
    # z dwóch jawnych list najdłuższych speców (DEMO_SHARD_1/2_SPECS, ~280 s każda) albo
    # (shard 3) całą resztę (dopełnienie obu list). Bez `--shard` w komendzie (podwójny
    # podział zgubiłby testy). Każdy shard zapisuje raport cząstkowy (blob); łączy je job
    # zbiorczy „E2E (Playwright)”. Test z pomiarem czasu (projekt `chromium-timing`) biegnie
    # w jobie `e2e-perf`, bez konkurencji o CPU.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Wszystkie shardy do końca — raport ma pokazać każdy czerwony test, nie tylko pierwszy.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
      - name: Install dependencies (cache miss)
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # Hostowany runner nie ma przeglądarki Playwrighta ani jej bibliotek systemowych.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      # Build z jobu `build` tego przebiegu (#127). restore-keys łapie też build
      # z wcześniejszej próby, gdy ponawiany jest sam shard.
      - name: Restore build from build job
        uses: actions/cache/restore@v6
        with:
          path: |
            .next
            !.next/cache
          key: next-build-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: next-build-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-
      - name: Verify restored build
        id: next-build
        continue-on-error: true
        run: node scripts/check-next-build.mjs
      # Fallback: brak lub niekompletny build → budujemy tutaj. Testowy token Cloudflare
      # Web Analytics musi trafić do builda, inaczej playwright.config.ts przebuduje aplikację (#234).
      - name: Build application for E2E (fallback)
        if: steps.next-build.outcome != 'success'
        timeout-minutes: 15
        env:
          NEXT_PUBLIC_CF_WEB_ANALYTICS_TOKEN: e2e-cf-analytics-token-00000000
        run: rm -rf .next && npm run build
      - name: Run E2E shard
        env:
          PLAYWRIGHT_SKIP_BUILD: '1'
          E2E_BLOB_NAME: shard-${{ matrix.shard }}
          E2E_DEMO_SHARD: ${{ matrix.shard }}
        run: npx playwright test --project=chromium
      # Raport cząstkowy zawsze (także przy zielonym shardzie) — job zbiorczy łączy komplet.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: blob-report-shard-${{ matrix.shard }}
          path: blob-report/
          retention-days: 2

  e2e-perf:
    name: E2E perf (lab CWV + INP)
    # Pomiary czasu w jednym miejscu, na osobnym runnerze (bez równoległych kart zabierających CPU):
    # INP otwarcia dialogu (#393, projekt `chromium-timing`) i lab CWV z INP-proxy (#395).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
      - name: Install dependencies (cache miss)
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Restore build from build job
        uses: actions/cache/restore@v6
        with:
          path: |
            .next
            !.next/cache
          key: next-build-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: next-build-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-
      - name: Verify restored build
        id: next-build
        continue-on-error: true
        run: node scripts/check-next-build.mjs
      - name: Build application for E2E (fallback)
        if: steps.next-build.outcome != 'success'
        timeout-minutes: 15
        env:
          NEXT_PUBLIC_CF_WEB_ANALYTICS_TOKEN: e2e-cf-analytics-token-00000000
        run: rm -rf .next && npm run build
      # Projekt `chromium-timing` bez zależności (`--no-deps`): reszta zestawu biegnie w shardach.
      - name: Run E2E timing specs
        env:
          PLAYWRIGHT_SKIP_BUILD: '1'
          E2E_BLOB_NAME: timing
        run: npx playwright test --project=chromium-timing --no-deps
      # Bramka wydajności, lab CWV (#395, ~2 min): LCP/CLS/TBT i INP-proxy (mediana prób) na tym
      # samym buildzie i Chromium — bez drugiego builda i bez instalacji przeglądarki.
      # JSON wyników trafia do playwright-report/ (artefakt tylko przy porażce).
      - name: Performance budget (lab CWV)
        run: node scripts/perf-lab.mjs
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: blob-report-timing
          path: blob-report/
          retention-days: 2
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: perf-lab-report
          path: playwright-report/
          retention-days: 2

  e2e-fixtures:
    name: E2E fixtures (${{ matrix.fixture }} ${{ matrix.part }})
    # Serwer `next dev` z danymi fikcyjnymi (playwright.applications-fixture.config.ts):
    # `full` = historia zgłoszeń, formularze, JobPosting; `error` = wymuszone błędy odczytu.
    # `full` w 2 częściach (~9 min na jednym runnerze; podział w konfiguracji fixture — jawna
    # lista części 2, bo `--shard` dzieli pliki po liczbie testów, nie po czasie). Każda część
    # zapisuje raport cząstkowy (blob) dla jobu zbiorczego. Nie używa builda (next dev),
    # ale startuje po nim — jak reszta E2E.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { fixture: full, part: 1/2 }
          - { fixture: full, part: 2/2 }
          - { fixture: error, part: 1/1 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
      - name: Install dependencies (cache miss)
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run E2E on application fixtures
        env:
          TEST_APPLICATIONS_FIXTURE: ${{ matrix.fixture }}
          TEST_APPLICATIONS_FIXTURE_PART: ${{ matrix.part }}
          E2E_BLOB_NAME: fixtures-${{ matrix.fixture }}-${{ strategy.job-index }}
        run: npx playwright test --config playwright.applications-fixture.config.ts
      # Raport cząstkowy zawsze (także przy zielonej części) — job zbiorczy łączy komplet.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: blob-report-fixtures-${{ matrix.fixture }}-${{ strategy.job-index }}
          path: blob-report/
          retention-days: 2
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fixtures-${{ matrix.fixture }}-${{ strategy.job-index }}-test-results
          path: test-results/
          retention-days: 2

  e2e-real:
    name: E2E real flow (PostgreSQL 16)
    # Przepływ kandydat ↔ pracodawca na prawdziwym PostgreSQL 16 i sesjach Better Auth
    # (#351, #66): `npm run test:e2e:real` tworzy izolowaną bazę (nazwa z „e2e”), nakłada
    # migracje produkcyjne i jednorazowe ograniczone loginy, potem Playwright + `next dev`.
    # Na start INFORMACYJNY (`continue-on-error`): scenariusz nigdy nie biegł w CI — czerwony
    # wynik jest widoczny w checku, ale nie blokuje scalania ani Railway `Wait for CI`.
    # Po serii zielonych przebiegów na main: usuń `continue-on-error` i dodaj do wymaganych.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
      - name: Install dependencies (cache miss)
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run E2E real flow
        env:
          E2E_PGHOST: 127.0.0.1
          E2E_PGPORT: ${{ job.services.postgres.ports[5432] }}
          E2E_PGUSER: postgres
          E2E_PGPASSWORD: isolated-test-only
          E2E_PGDATABASE: pracujbe_e2e_real
        run: npm run test:e2e:real
      # Trace'y (`retain-on-failure`) tylko przy porażce, krótka retencja.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-real-test-results
          path: test-results/
          retention-days: 2

  e2e:
    name: E2E (Playwright)
    # Job zbiorczy o STAŁEJ nazwie wymaganego checka (reguły scalania, Railway `Wait for CI`).
    # `always()`: pominięty job liczyłby się jako zaliczony check — tutaj czerwony shard,
    # pomiar albo fixture zawsze daje czerwony „E2E (Playwright)”. Łączy raporty cząstkowe
    # w jeden raport html + raport flaków (#375).
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: [build, e2e-shard, e2e-perf, e2e-fixtures]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
      - name: Install dependencies (cache miss)
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Download blob reports
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: blob-report-*
          path: blob-report
          merge-multiple: true
      # Awaria samego łączenia raportu nie zmienia wyniku testów — ten ustala krok niżej.
      - name: Merge E2E reports
        id: merge
        if: hashFiles('blob-report/*.zip') != ''
        continue-on-error: true
        run: npx playwright merge-reports --config playwright.merge.config.ts blob-report
      - name: Check E2E jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const needs = JSON.parse(process.env.RESULTS);
            const bad = Object.entries(needs).filter(([, job]) => job.result !== "success");
            for (const [name, job] of Object.entries(needs)) console.log(`${name}: ${job.result}`);
            if (bad.length > 0) { console.error(`Niezaliczone: ${bad.map(([name]) => name).join(", ")}`); process.exit(1); }
          '
      # Raport tylko przy porażce i z krótką retencją.
      - uses: actions/upload-artifact@v7
        if: failure() && steps.merge.outcome == 'success'
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 2
