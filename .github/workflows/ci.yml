name: CI

# CI Pracuj.be — uruchamiane WYŁĄCZNIE na self-hosted runnerach.
# Etykiety (labels) runnera: self-hosted + linux + x64.
# Rejestracja i wymagania runnera: docs/SELF_HOSTED_RUNNERS.md
#
# Nie zmieniaj `runs-on` na `ubuntu-latest` bez wyraźnej decyzji — to wymóg projektu.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Minimalne uprawnienia tokenu GITHUB_TOKEN (least privilege).
permissions:
  contents: read

# Anuluj starsze przebiegi dla tej samej gałęzi/PR (oszczędza czas runnerów).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Placeholdery pozwalające na build bez prawdziwych sekretów (strony publiczne mają fallback).
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  NEXT_PUBLIC_DEFAULT_LOCALE: pl
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  install:
    name: Install & cache deps
    # Nie uruchamiaj na self-hosted runnerach dla PR z forków (bezpieczeństwo).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false
      # node_modules przekazujemy dalej jako artefakt, by nie instalować w każdym jobie.
      - name: Archive node_modules
        run: tar -czf node_modules.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: node_modules
          path: node_modules.tar.gz
          retention-days: 1

  lint:
    name: Lint
    needs: install
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with: { name: node_modules }
      - run: tar -xzf node_modules.tar.gz
      - run: npm run lint

  typecheck:
    name: Typecheck
    needs: install
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with: { name: node_modules }
      - run: tar -xzf node_modules.tar.gz
      - run: npm run typecheck

  unit:
    name: Unit tests (Vitest)
    needs: install
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with: { name: node_modules }
      - run: tar -xzf node_modules.tar.gz
      - run: npm run test

  build:
    name: Build (Next.js)
    needs: [lint, typecheck, unit]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with: { name: node_modules }
      - run: tar -xzf node_modules.tar.gz
      - run: npm run build

  rls:
    name: RLS integration (PostgreSQL 16)
    # Niezależny od buildu aplikacji: weryfikuje polityki RLS i triggery integralności
    # na CZYSTYM PostgreSQL 16 (shim Supabase + wszystkie migracje + adwersaryjne asercje).
    # Domyka lukę audytu „migracje/RLS niezweryfikowane w CI". Nie wymaga node_modules.
    #
    # Wymagania runnera: Docker (usługi kontenerowe) + klient `psql` (postgresql-client).
    # Patrz docs/SELF_HOSTED_RUNNERS.md.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Verify psql client
        run: psql --version
      - name: RLS/triggers adversarial tests
        run: bash scripts/test-rls.sh

  e2e:
    name: E2E (Playwright)
    needs: install
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with: { name: node_modules }
      - run: tar -xzf node_modules.tar.gz
      # Przeglądarki Playwrighta powinny być zainstalowane na runnerze (patrz docs).
      # Poniższe jest bezpiecznym no-op, jeśli już są; --with-deps pomijamy, bo wymaga sudo.
      - name: Ensure Playwright browsers
        run: npx playwright install chromium
      - name: Run E2E
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
