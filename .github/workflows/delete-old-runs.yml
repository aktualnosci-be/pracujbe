name: ♻ Delete old workflow runs
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'
# Run at 00:00 on Monday.

jobs:
  del_runs:
    name: ♻ Delete old workflow runs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: ♻ Delete workflow runs
        # Przypięte do pełnego SHA, nie do ruchomego taga (#601) — jedyny krok w repo z
        # uprawnieniem `actions: write`. Zmiana wersji wymaga jawnej aktualizacji SHA po
        # niezależnym przeglądzie commita.
        uses: Mattraks/delete-workflow-runs@39f0bbed25d76b34de5594dceab824811479e5de # v2.0.6
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          # Historia przebiegów (także `main`) jest potrzebna przy analizie regresji (#1105):
          # 90 dni = domyślna retencja logów i artefaktów GitHub Actions, a co najmniej 50
          # ostatnich przebiegów każdego workflowu zostaje niezależnie od wieku. Akcja nie
          # umie wyłączyć jednej gałęzi (`check_branch_existence` w v2.0.6 porównuje
          # `indexOf(...) === 1`), więc chronimy historię długością okna, nie filtrem gałęzi.
          # Minimum pilnuje `scripts/check-ci-workflows.mjs`.
          retain_days: 90
          keep_minimum_runs: 50
