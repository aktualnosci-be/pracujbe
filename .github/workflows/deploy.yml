name: Deploy

# Deploy Pracuj.be na Vercel — na self-hosted runnerach, URUCHAMIANY DOPIERO PO ZIELONYM CI
# (workflow_run: "CI" completed + success) dla tego samego commita (head_sha).
#   - main    → PRODUKCJA
#   - develop → STAGING (preview, noindex)
#
# Wymagane sekrety: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID (Settings → Secrets → Actions).
# Bez VERCEL_TOKEN job pomija deploy (zielono). Szczegóły: docs/DEPLOYMENT.md, docs/STAGING.md.

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main, develop]
  workflow_dispatch:

# Minimalne uprawnienia tokenu GITHUB_TOKEN (least privilege).
permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  deploy:
    name: Deploy to Vercel
    # Tylko gdy CI zakończyło się sukcesem (lub ręczne uruchomienie).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, linux, x64]
    environment: ${{ (github.event.workflow_run.head_branch || github.ref_name) == 'main' && 'production' || 'staging' }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      VERCEL_CLI_VERSION: '56.5.0'
    steps:
      # Bramka: bez VERCEL_TOKEN pomijamy deploy (zielono), z jasnym komunikatem.
      - name: Sprawdź konfigurację Vercel
        id: cfg
        run: |
          if [ -z "${VERCEL_TOKEN}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy pominięty::Brak sekretu VERCEL_TOKEN. Dodaj VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID (docs/DEPLOYMENT.md)."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
          echo "is_prod=${{ env.HEAD_BRANCH == 'main' }}" >> "$GITHUB_OUTPUT"

      - name: Checkout (dokładny commit z CI)
        if: steps.cfg.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}

      - name: Setup Node
        if: steps.cfg.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Vercel CLI (pinned)
        if: steps.cfg.outputs.enabled == 'true'
        run: npm i -g vercel@${VERCEL_CLI_VERSION}

      - name: Pull Vercel env (production)
        if: steps.cfg.outputs.enabled == 'true' && steps.cfg.outputs.is_prod == 'true'
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Pull Vercel env (preview/staging)
        if: steps.cfg.outputs.enabled == 'true' && steps.cfg.outputs.is_prod != 'true'
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build (production)
        if: steps.cfg.outputs.enabled == 'true' && steps.cfg.outputs.is_prod == 'true'
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Build (preview/staging)
        if: steps.cfg.outputs.enabled == 'true' && steps.cfg.outputs.is_prod != 'true'
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy (production)
        if: steps.cfg.outputs.enabled == 'true' && steps.cfg.outputs.is_prod == 'true'
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Deploy (preview/staging)
        if: steps.cfg.outputs.enabled == 'true' && steps.cfg.outputs.is_prod != 'true'
        run: vercel deploy --prebuilt --token="$VERCEL_TOKEN"
