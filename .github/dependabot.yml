# Dependabot (#751): tylko digest obrazu bazowego usługi kopii (docker/backup/Dockerfile).
# PR pokazuje stary i nowy digest; job CI „Backup image (build + scan)” buduje, uruchamia
# smoke i skanuje nowy obraz przed scaleniem. Zależności npm aplikacji — bez zmian (SCA).
version: 2
updates:
  - package-ecosystem: docker
    directory: /docker/backup
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: 'chore(backup-image)'
